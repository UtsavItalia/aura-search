# Aura Search — Xcode project definition.
# The .xcodeproj is generated from this file with XcodeGen, so it never
# needs to be committed or hand-merged. Run ./scripts/bootstrap.sh.
name: AuraSearch
options:
  bundleIdPrefix: io.github.aurasearch   # TODO: change to your own reverse-domain ID
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                 # set your team in Xcode > Signing & Capabilities
targets:
  AuraSearch:
    type: application
    platform: iOS
    sources:
      - path: AuraSearch
        excludes:
          - "Resources/**"
      - path: AuraSearch/Resources
        buildPhase: resources
    info:
      path: AuraSearch/Info.plist
      properties:
        CFBundleDisplayName: Aura Search
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aurasearch.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  AuraSearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraSearchTests
    dependencies:
      - target: AuraSearch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AuraSearch:
    build:
      targets:
        AuraSearch: all
        AuraSearchTests: [test]
    test:
      targets:
        - AuraSearchTests
