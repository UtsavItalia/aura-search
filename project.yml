# Aura Search — Xcode project definition.
# The .xcodeproj is generated from this file with XcodeGen, so it never
# needs to be committed or hand-merged. Run ./scripts/bootstrap.sh.
name: AuraSearch
options:
  bundleIdPrefix: io.github.aurasearch   # TODO: change to your own reverse-domain ID
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Signing for every target. Your team ID goes in Config/Local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  AuraSearch:
    type: application
    platform: iOS
    sources:
      - path: AuraSearch
        excludes:
          - "Resources/**"
      - path: AuraSearch/Resources
        buildPhase: resources
    info:
      path: AuraSearch/Info.plist
      properties:
        CFBundleDisplayName: Aura Search
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Lets animations run at up to 120 fps on ProMotion iPhones. Without
        # it, iOS holds every app to 60.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Downloads go to Documents/Downloads, shown in the Files app under
        # On My iPhone > Aura Search.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Web features iOS asks permission for. Without these the app crashes
        # when a page uses them (Save to Photos, a photo upload's camera...).
        NSPhotoLibraryAddUsageDescription: Saves images you choose to your photo library.
        NSCameraUsageDescription: Lets websites you allow use the camera, like for a video call or a photo upload.
        NSMicrophoneUsageDescription: Lets websites you allow use the microphone, like for a video call.
        NSLocationWhenInUseUsageDescription: Lets websites you allow see your location, like maps.
    dependencies:
      # Apple's on-device model, for Summarize. Weak, so the app still opens
      # on iOS 17-25, where the framework doesn't exist.
      - sdk: FoundationModels.framework
        weak: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aurasearch.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  AuraSearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraSearchTests
    dependencies:
      - target: AuraSearch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AuraSearch:
    build:
      targets:
        AuraSearch: all
        AuraSearchTests: [test]
    test:
      targets:
        - AuraSearchTests
